name: SlowRoads Native Android APK

on:
  push:
    branches: [react-native-android]
    paths:
      - 'Mobile/**'
      - '.github/workflows/slowroads-native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build native SlowRoads APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Checkout native port branch
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # API 37 is distributed as android-37.0; Gradle sometimes looks up android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            sudo ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Generate original Slow Roads launcher icon assets
        run: npm run icons

      - name: Verify generated icon dimensions and adaptive icon config
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const expo = require('./app.json').expo;
          const files = [expo.icon, expo.android.adaptiveIcon.foregroundImage, expo.android.adaptiveIcon.monochromeImage];
          Promise.all(files.map(async file => {
            if (!fs.existsSync(file)) throw Error('Missing icon '+file);
            const m = await sharp(file).metadata();
            if (m.format !== 'png' || m.width !== 1024 || m.height !== 1024) throw Error('Bad icon dimensions '+file);
            console.log('PASS',file);
          })).catch(error => { console.error(error);process.exitCode=1 });
          NODE

      - name: Run native game engine tests
        run: npm test

      - name: Verify Expo SDK dependencies
        run: npx expo install --check

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Verify expo-gl R8 safety and Android launcher icons after prebuild
        run: |
          grep -F -- '-keep class expo.modules.gl.** { *; }' android/app/proguard-rules.pro
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          find android/app/src/main/res -type f -iname '*launcher*' | head -25

      # A debug APK is not standalone: it expects Metro on port 8081.
      # A release APK invokes the RN/Expo Gradle JS bundling task.
      - name: Build standalone release APK (includes JavaScript)
        run: cd android && ./gradlew --no-daemon :app:assembleRelease

      - name: Verify standalone APK embeds React Native JavaScript
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "::error::Release APK missing"; exit 1; }
          unzip -Z -1 "$APK" > /tmp/slowroads-apk-files.txt
          grep -Fxq 'assets/index.android.bundle' /tmp/slowroads-apk-files.txt || {
            echo "::error::JavaScript bundle missing from APK: refusing to publish a Metro-dependent build"
            exit 1
          }
          echo "Verified: standalone release APK contains assets/index.android.bundle"
          ls -lh "$APK"

      - name: Upload standalone Android release APK
        uses: actions/upload-artifact@v6
        with:
          name: SlowRoads-Android-v0.2.2-Standalone
          path: Mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
